app = 'gamespaglu-server'
# Singapore, matching the officepaglu backend and closest to Indian players.
#
# Trade-off, recorded because it is the first thing to look at if play feels
# sluggish: Supabase is in ap-southeast-2 (Sydney), so every player action pays
# a ~90ms hop per query, and an action runs several sequential queries inside
# one transaction. Moving this to 'syd' would cut that at the cost of ~70ms more
# socket latency to India. That is the lever.
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  # Never park the machine: a parked machine drops every open socket, and this
  # process holds live game rooms rather than serving stateless requests.
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
